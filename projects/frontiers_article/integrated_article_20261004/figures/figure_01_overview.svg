   <g id="text_1">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="35.7408" y="26.865881" transform="rotate(-0 35.7408 26.865881)">A  Mechanisms shape the value and use of opportunity</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(58.785497 71.671781)">Valuation and feedback</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(58.336903 82.474242)">E01: weighting, history,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(85.779872 93.276703)">information</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(257.473828 71.671781)">Action representation</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(262.123594 82.474242)">E02: independently</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(274.498594 93.276703)">learned levels</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(463.729191 71.672133)">Persistent social</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(468.139191 82.473891)">consequences</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(448.416534 93.276352)">E03: future-state value</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(223.258359 171.308524)">Learned values and action allocation</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(219.936094 182.15036)">Engagement | intensity | concealment</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #245077" x="306" y="223.3314" transform="rotate(-0 306 223.3314)">E05: learned modal crossing differs from objective indifference</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="35.7408" y="248.7078" transform="rotate(-0 35.7408 248.7078)">B  Different achievements in a receptive-context search (E04)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(71.035453 290.959812)">Receptive option</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(83.598891 301.762273)">is available</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(256.593516 290.959812)">Accepted authenticity</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(255.477656 301.762273)">has been encountered</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(465.163453 290.959812)">Receptive option</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(461.581031 301.762273)">is used repeatedly</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="306" y="350.2134" transform="rotate(-0 306 350.2134)">Action/context representation affects the links; one success does not guarantee sustained use.</text>
